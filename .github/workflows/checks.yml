# Runs on every pull request (and pushes to main): the doc / learning-loop checks, so no session has to
# remember them (GPT6 review, 2026-10-27). Make "checks / doccheck" a required status check on main
# (repository Settings -> Branches) so a failing PR cannot be merged. No game data is needed or used:
# selftest's game runs need the private reference files and stay with the maintainers (docs/MAINTAIN.md).
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  doccheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # learncheck compares changed game notes with the merge base on origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt ruff==0.16.8
      - name: Lint (syntax errors, undefined names, definitions shadowed before use; no style rules)
        # The three Rainbow Islands modules are frozen / excluded from the automatic checks (docs/MAINTAIN.md):
        # their second ink_index stays as verified.
        run: >
          ruff check --isolated --select E9,F63,F7,F82,F811
          --per-file-ignores "nexclash/rainbow.py:F811,nexclash/rainbow_z80n.py:F811,nexclash/rainbow_z80n_sky.py:F811" .
      - name: learncheck self-check (parser, tags, distinct-game counts)
        run: python tools/learncheck.py --selfcheck
      - name: doccheck (references, budgets, technique cards, learncheck)
        run: python tools/doccheck.py
      - name: DMA functional checks (no game data; includes no-blitter and CPU fallback)
        run: python -m nexclash.dma_check
      - name: Rainbow game tcommit DMA checks (mapped RAM, policies, stalls and negative controls)
        run: python -m nexclash.rainbow_dma_check
      - name: Workflow regression checks
        run: python tools/workflow_check.py
      - name: Palette standard report (warns, never fails; docs/COLOURS.md)
        run: python tools/palette_check.py
