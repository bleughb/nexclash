# Publishing a release in the GitHub UI (tag vX.Y.Z, any v/V) builds nexclash-X.Y.Z.zip and attaches
# it. To (re)attach the zip to an existing release: Actions -> release -> Run workflow -> its tag.
name: release
on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the zip to (e.g. v0.1.2)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version from the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "${TAG#[vV]}" > VERSION
      - name: Build package (refuses game data)
        run: python tools/make_package.py -o dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Download nexclash-$(cat VERSION).zip, unzip, \`pip install skoolkit\`, then \`python nexclash.py patch MyGame.z80\`. Supported games: STATUS.md. No game files included - bring your own snapshot. GPL-3.0-or-later."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/nexclash-*.zip --clobber
          else
            gh release create "$TAG" dist/nexclash-*.zip --title "nexclash $(cat VERSION)" --notes "$NOTES"
          fi
