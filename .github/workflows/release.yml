# Publishing a release in the GitHub UI (tag vX.Y.Z, any v/V) builds nexclash-X.Y.Z.zip and attaches
# it. To (re)attach the zip to an existing release: Actions -> release -> Run workflow -> its tag.
name: release
on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the zip to (e.g. v0.1.2)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version from the tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="$REQUESTED_TAG"
          [[ "$TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          test "$(cat VERSION)" = "${TAG#[vV]}" || { echo "VERSION does not match tag"; exit 1; }
      - name: Install smoke-test dependencies
        run: python -m pip install -r requirements.txt
      - name: Build package (refuses game data)
        run: python tools/make_package.py -o dist
      - name: Smoke-test archive and contribution workflow
        run: python tools/workflow_check.py --package "dist/nexclash-$(cat VERSION).zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Download nexclash-$(cat VERSION).zip, unzip, \`pip install -r requirements.txt\`, then \`python nexclash.py patch MyGame.z80\`. Supported games: STATUS.md. No game files included - bring your own snapshot. GPL-3.0-or-later."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/nexclash-*.zip --clobber
          else
            gh release create "$TAG" dist/nexclash-*.zip --title "nexclash $(cat VERSION)" --notes "$NOTES"
          fi
